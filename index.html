<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BokiExercise-Quiz｜問題セット選択</title>
<style>
  :root { --bg:#0f1115; --fg:#e8eaf1; --muted:#9aa0a6; --card:#171a21; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif; }
  #app { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border:1px solid #222; border-radius: 14px; padding: 14px; margin: 12px 0; }
  h1 { font-size: 18px; margin: 6px 0 6px; }
  .muted { color: var(--muted); font-size: 13px; line-height: 1.5; }
  label { font-size: 13px; color: var(--muted); display:block; margin-bottom: 8px; }
  select { width:100%; padding: 10px 12px; border-radius: 10px; border:1px solid #2b2f3a; background:#0f1319; color:var(--fg); font-size: 15px; }
  button { width:100%; margin-top: 10px; padding: 12px; border-radius: 12px; border:1px solid #2b2f3a; background:#1c222b; color:var(--fg); font-size: 15px; }
  button:active { transform: scale(.99); }
  .links a { color:#cdd3db; text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .pill { display:inline-block; padding:2px 10px; border:1px solid #2b2f3a; border-radius:999px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div id="app">

  <div class="card">
    <h1>BokiExercise 左右タッチ即判定クイズ</h1>
    <div class="muted">
      使いたい「問題セット」を選ぶと、そのままクイズ画面へ移動します。<br>
      <span class="pill">左=借方 / 右=貸方</span>
    </div>
  </div>

  <div class="card">
    <label for="setSelect">問題セット：</label>
    <select id="setSelect">
      <option value="standard">3級仕訳標準</option>
      <option value="genkin">3級仕訳基礎0.現金のみ</option>
      <option value="shouhin">3級仕訳基礎1.商品取引</option>
      <option value="kotei">3級仕訳基礎2.固定資産</option>
      <option value="keika">3級仕訳基礎3.経過勘定</option>

      <option value="zeikin">3級仕訳基礎4.税金・配当</option>
      <option value="kyuryo">3級仕訳基礎5.給料・福利</option>
      <option value="kashitsuke">3級仕訳基礎6.貸付・立替</option>
      <option value="kariire">3級仕訳基礎7.借入・預り</option>
      <option value="shohi">3級仕訳基礎8.諸費・雑費</option>
      <option value="fudosan">3級仕訳基礎9.不動産</option>
      <option value="shisan">3級仕訳基礎10.純資産</option>
    </select>

    <button id="goBtn">このセットで開始</button>

    <div class="muted" style="margin-top:10px;">
      ※ 選んだのに移動しない場合は、その touch_***.html がまだ未作成です。
    </div>
  </div>

  <div class="card links">
    <div class="muted">直リンク（確認用）：</div>
    <div class="muted" style="line-height:1.9;margin-top:6px;">
      <a href="touch_standard.html">touch_standard.html</a><br>
      <a href="touch_genkin.html">touch_genkin.html</a><br>
      <a href="touch_shouhin.html">touch_shouhin.html</a><br>
      <a href="touch_kotei.html">touch_kotei.html</a><br>
      <a href="touch_keika.html">touch_keika.html</a><br>
      <span class="muted">（4以降は作成後に自動で開けます）</span>
    </div>
  </div>

</div>

<script>
const pages = {
  standard: "touch_standard.html",
  genkin: "touch_genkin.html",
  shouhin: "touch_shouhin.html",
  kotei: "touch_kotei.html",
  keika: "touch_keika.html",

  zeikin: "touch_zeikin.html",
  kyuryo: "touch_kyuryo.html",
  kashitsuke: "touch_kashitsuke.html",
  kariire: "touch_kariire.html",
  shohi: "touch_shohi.html",
  fudosan: "touch_fudosan.html",
  shisan: "touch_shisan.html",
};

const setSelect = document.getElementById("setSelect");
const goBtn = document.getElementById("goBtn");

function go(){
  const key = setSelect.value;
  const url = pages[key];
  if(!url){
    alert("対応ファイルが見つかりません。");
    return;
  }
  location.href = url;
}

setSelect.addEventListener("change", go);
goBtn.addEventListener("click", go);
</script>
</body>
</html>

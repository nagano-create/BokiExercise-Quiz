<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BokiExercise 左右タッチ即判定（標準）</title>

<style>
  :root{
    --bg:#0f1115; --fg:#e8eaf1; --muted:#9aa0a6;
    --ok:#1db954; --ng:#ff4d4f; --card:#171a21; --bd:#2b2f3a;

    /* ▼ 下固定ボタンの高さ想定（PCでスコアが落ちないために計算に使う） */
    --controls-h: 64px;
    --controls-gap: 14px; /* 下余白 */
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","YuGothic","Meiryo",sans-serif;
    overflow:hidden; /* 横スクロール含め封じ */
  }

  /* Topリンク（左上固定） */
  .top-link{
    position: fixed;
    left: 12px; top: 10px;
    z-index: 60;
    font-size:12px;
    color: var(--fg);
    text-decoration:none;
    border:1px solid var(--bd);
    background: rgba(15,17,21,.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding:6px 12px;
    border-radius:999px;
    opacity:.65;
    transition: opacity .15s ease, background .15s ease, transform .05s ease, box-shadow .2s ease, border-color .2s ease;
    display:inline-flex;
    gap:6px;
    align-items:center;
    white-space:nowrap;
    user-select:none;
  }
  .top-link:active{ transform: scale(.98); }

  /* 結果画面では Top を強調 */
  body.results .top-link{
    opacity: 1;
    background: rgba(23,26,33,.96);
    border-color: rgba(29,185,84,.55);
    box-shadow:
      0 0 0 2px rgba(29,185,84,.12),
      0 8px 22px rgba(0,0,0,.35),
      0 0 18px rgba(29,185,84,.12);
  }
  body.results .top-link .arrow{ animation: nudge 1.1s ease-in-out infinite; }
  @keyframes nudge{ 0%,100%{ transform: translateX(0); } 50%{ transform: translateX(-3px); } }

  /* アプリ枠 */
  #app{
    height: 100svh;
    max-width: 720px;
    margin: 0 auto;
    display:flex;
    flex-direction:column;
  }

  header{
    padding: 12px 16px;
    background: var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    border-bottom:1px solid rgba(43,47,58,.35);
    flex: 0 0 auto;
  }

  /* タイトル：2行・同じサイズ */
  .title{
    text-align:center;
    line-height:1.08;
    user-select:none;
  }
  .title .t1,.title .t2{
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .02em;
  }
  .title .t2{ margin-top:2px; }

  .pill{
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    padding: 2px 10px;
    border:1px solid var(--bd);
    border-radius:999px;
    font-size:11px;
    color: var(--muted);
    white-space:nowrap;
    user-select:none;
  }

  /* 成長表示：絵だけ */
  #growthBar{
    padding:6px 10px;
    display:flex;
    justify-content:center;
    background: rgba(23,26,33,.55);
    border-bottom:1px solid rgba(43,47,58,.35);
    flex: 0 0 auto;
  }
  #growthEmoji{
    font-size: 22px;
    line-height: 1;
    user-select:none;
  }

  /* 問題表示（クイズ中はスクロールしない） */
  #questionBox{
    padding: 10px 16px 8px;
    text-align:center;
    overflow:hidden;
    flex: 0 0 auto;
  }
  body.results #questionBox{
    overflow:auto;
    text-align:left;
    max-height: 52vh;
  }

  #question{
    margin: 6px 0 4px;
    font-weight: 800;
    font-size: clamp(20px, 3.2vw, 30px);
    line-height:1.35;
    text-align:center;
    overflow-wrap:anywhere;
    min-height: 1.35em;
  }
  body.results #question{ text-align:left; }

  #sub{
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    margin-bottom: 0;
  }

  /* ▼ スコアバーは常に見える位置（固定ではなくフロー内で確保） */
  #scoreBar{
    padding: 8px 16px;
    font-size: 13px;
    color: var(--muted);
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-top:1px solid rgba(43,47,58,.35);
    flex: 0 0 auto;
  }

  /* ▼ 左右タッチ面：残りの高さを全部使う（ボタン分だけ引く） */
  #arena{
    flex: 1 1 auto;
    display:flex;
    min-height: 220px;
    /* 下固定ボタンに被らないよう、内部で余白を確保 */
    padding-bottom: calc(var(--controls-h) + var(--controls-gap) + env(safe-area-inset-bottom));
  }
  body.results #arena{ opacity:.25; pointer-events:none; }

  .side{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: clamp(30px, 7vw, 46px);
    font-weight:900;
    border-top:1px solid #222;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  .left{
    border-right:1px solid #222;
    background: linear-gradient(180deg, rgba(45,45,55,.25), rgba(0,0,0,.08));
  }
  .right{
    background: linear-gradient(180deg, rgba(45,45,55,.25), rgba(0,0,0,.08));
  }
  .label{ pointer-events:none; opacity:.92; }

  /* フッター：固定ボタンと干渉しない（下駄は入れない） */
  #footerNote{
    text-align:center;
    font-size:11px;
    color: var(--muted);
    padding: 6px 0 10px;
    flex: 0 0 auto;
  }

  /* スタートボタン：画面下固定 */
  #controls{
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(var(--controls-gap) + env(safe-area-inset-bottom));
    width: min(720px, calc(100% - 24px));
    z-index: 55;
    display:flex;
    justify-content:center;
    pointer-events:none;
    height: var(--controls-h);
  }
  #btnStart{
    pointer-events:auto;
    width: 100%;
    max-width: 420px;
    padding: 14px 14px;
    border: 1px solid var(--bd);
    background:#1c222b;
    color: var(--fg);
    border-radius: 14px;
    font-size: 15px;
    font-weight: 800;
    cursor:pointer;
    height: var(--controls-h);
  }
  #btnStart:active{ transform: scale(.99); }

  /* 〇✕：中央固定（絶対座標） */
  #flash{
    position: fixed;
    inset: 0;
    display:none;
    z-index: 80;
    pointer-events:none;
  }
  #flash::before{ content:""; position:absolute; inset:0; background: transparent; }
  #flash.ok::before{ background: rgba(29,185,84,.12); }
  #flash.ng::before{ background: rgba(255,77,79,.12); }

  #flashMark{
    position:absolute;
    left:50%;
    top:50%;
    transform: translate(-50%, -50%);
    font-size: clamp(56px, 18vw, 120px);
    font-weight: 900;
    line-height: 1;
    color: var(--fg);
  }
  #flash.ok #flashMark{ color: var(--ok); }
  #flash.ng #flashMark{ color: var(--ng); }

  /* 結果 */
  .result-item{ font-size:14px; margin-bottom:10px; }
  .badge{
    display:inline-block;
    min-width:2.2em;
    text-align:center;
    border-radius:999px;
    padding:0 8px;
    margin-right:6px;
    font-size:12px;
    border:1px solid rgba(43,47,58,.55);
  }
  .badge-ok{ background:rgba(29,185,84,.15); color:var(--ok); }
  .badge-ng{ background:rgba(255,77,79,.15); color:var(--ng); }
  .small-muted{ font-size:11px; color:var(--muted); }

  .growth-emoji-big{ font-size:110px; line-height:1.05; text-align:center; }
  .growth-box{ text-align:center; margin:8px 0 10px; }
</style>
</head>

<body>
<a class="top-link" href="index.html" aria-label="トップへ戻る"><span class="arrow" aria-hidden="true">←</span><span>Top</span></a>

<div id="app">
  <header>
    <div class="title" aria-label="BokiExercise 左右タッチ即判定">
      <div class="t1">BokiExercise</div>
      <div class="t2">左右タッチ即判定</div>
    </div>
    <div class="pill">標準</div>
  </header>

  <div id="growthBar"><div id="growthEmoji">🌰</div></div>

  <div id="questionBox">
    <div id="question"></div>
    <div id="sub">左／右＝借方／貸方（満点🌸）</div>
  </div>

  <div id="arena">
    <div class="side left" id="leftSide" role="button" aria-label="左"><div class="label">左</div></div>
    <div class="side right" id="rightSide" role="button" aria-label="右"><div class="label">右</div></div>
  </div>

  <div id="scoreBar">
    <div>問 <span id="idx">0</span>/<span id="total">0</span></div>
    <div>正解 <span id="ok">0</span> ・ ミス <span id="ng">0</span></div>
  </div>

  <div id="footerNote">© BokiExercise｜homepage</div>
</div>

<div id="controls">
  <button id="btnStart">スタート / シャッフル</button>
</div>

<div id="flash"><div id="flashMark">⭕</div></div>

<script>
const set_standard = [
  { q: "資産（現金・売掛金など）が『増加』するのは？", correct: "left" },
  { q: "資産（現金・売掛金など）が『減少』するのは？", correct: "right" },
  { q: "負債（買掛金・借入金など）が『増加』するのは？", correct: "right" },
  { q: "負債（買掛金・借入金など）が『減少』するのは？", correct: "left" },
  { q: "純資産（資本金・繰越利益剰余金など）が『増加』するのは？", correct: "right" },
  { q: "費用（仕入・給料・減価償却費など）が『発生』するのは？", correct: "left" },
  { q: "収益（売上・受取利息など）が『発生』するのは？", correct: "right" },
  { q: "売上が計上されたときの『売上』は？", correct: "right" },
  { q: "仕入で商品が増えたときの『仕入』は？", correct: "left" },
  { q: "備品を現金で購入したときの『備品』は？", correct: "left" },
  { q: "備品を現金で購入したときの『現金』は？", correct: "right" },
  { q: "家賃を支払ったときの『支払家賃』は？", correct: "left" },
  { q: "売掛金を回収して『現金』が増えたときの『現金』は？", correct: "left" },
  { q: "買掛金を支払って『買掛金』が減少したときの『買掛金』は？", correct: "left" },
  { q: "前受金が発生したときの『前受金』は？", correct: "right" }
];

let questions = JSON.parse(JSON.stringify(set_standard));
let idx = 0, ok = 0, ng = 0;
let results = [];

const flash = document.getElementById('flash');
const flashMark = document.getElementById('flashMark');
const questionBox = document.getElementById('questionBox');

const elTotal = document.getElementById('total');
const elIdx = document.getElementById('idx');
const elOk = document.getElementById('ok');
const elNg = document.getElementById('ng');
const growthEmoji = document.getElementById('growthEmoji');

elTotal.textContent = questions.length;

function setGrowthEmoji(){
  const total = questions.length;
  if (total > 0 && ok === total) growthEmoji.textContent = "🌸";
  else if (ok >= 6) growthEmoji.textContent = "🌿";
  else if (ok >= 1) growthEmoji.textContent = "🌱";
  else growthEmoji.textContent = "🌰";
}

function resetQuestionBoxUI(){
  questionBox.innerHTML = `
    <div id="question"></div>
    <div id="sub">左／右＝借方／貸方（満点🌸）</div>
  `;
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function start(){
  document.body.classList.remove('results');
  resetQuestionBoxUI();

  idx = 0; ok = 0; ng = 0; results = [];
  questions = shuffle([...questions]);

  elOk.textContent = ok;
  elNg.textContent = ng;
  elIdx.textContent = 0;
  elTotal.textContent = questions.length;

  setGrowthEmoji();
  next();
}

function next(){
  if (idx >= questions.length){
    showResults();
    return;
  }
  const item = questions[idx];
  const elQuestion = document.getElementById('question');
  elQuestion.textContent = item.q;
  elIdx.textContent = idx + 1;
}

function vibrate(ms=50){ if (navigator.vibrate) navigator.vibrate(ms); }

let audioCtx = null;
function beep(okFlag=true){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = okFlag ? 880 : 220;
    g.gain.value = 0.02;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    setTimeout(()=>{ o.stop(); }, 120);
  }catch(e){}
}

function showFlash(isOK){
  flash.className = isOK ? 'ok' : 'ng';
  flashMark.textContent = isOK ? '⭕' : '❌';
  flash.style.display = 'block';
  setTimeout(()=>{ flash.style.display='none'; }, 350);
}

function judge(side){
  if (idx >= questions.length) return;
  const item = questions[idx];
  const isOK = (side === item.correct);

  results.push({
    no: idx+1,
    question: item.q,
    answered: side,
    correct: item.correct,
    isOK
  });

  showFlash(isOK);

  if (isOK){ ok++; vibrate(20); beep(true); }
  else { ng++; vibrate([30,40,30]); beep(false); }

  elOk.textContent = ok;
  elNg.textContent = ng;
  setGrowthEmoji();

  idx++;
  setTimeout(next, 600);
}

function showResults(){
  document.body.classList.add('results');

  const total = questions.length;
  const percent = total ? Math.round(ok / total * 100) : 0;

  let bigEmoji = "🌿";
  let msg = "芽が出てきました。続ければきっと満開になります。";
  if (ok === total) { bigEmoji="🌸"; msg="全問正解！花が咲きました。"; }
  else if (ok <= 5) { bigEmoji="🌱"; msg="今日は種まきの日。少しずつ育てていきましょう。"; }

  let html = "";
  html += `
    <div class="growth-box">
      <div class="growth-emoji-big">${bigEmoji}</div>
      <div class="small-muted" style="text-align:center;">${msg}</div>
    </div>
    <div style="margin:8px 0 10px; font-size:18px; font-weight:800;">結果一覧</div>
    <div class="small-muted" style="margin-bottom:10px;">正解 ${ok} / ${total}（${percent}%）</div>
  `;

  results.forEach(r=>{
    const badgeClass = r.isOK ? "badge-ok" : "badge-ng";
    const badgeLabel = r.isOK ? "○" : "×";
    const answeredJp = r.answered === "left" ? "左" : "右";
    const correctJp  = r.correct  === "left" ? "左" : "右";
    html += `
      <div class="result-item">
        <span class="badge ${badgeClass}">${badgeLabel}</span>
        <strong>${r.no}. ${escapeHtml(r.question)}</strong><br>
        <span class="small-muted">あなたの答え：${answeredJp} ／ 正解：${correctJp}</span>
      </div>
    `;
  });

  questionBox.innerHTML = html;
  elIdx.textContent = total;
  setGrowthEmoji();
  questionBox.scrollTop = 0;
}

function escapeHtml(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

document.getElementById('leftSide').addEventListener('click', ()=>judge('left'));
document.getElementById('rightSide').addEventListener('click', ()=>judge('right'));
document.getElementById('btnStart').addEventListener('click', start);

window.addEventListener('keydown', (e)=>{
  if (e.code === 'Space' || e.key === ' ') { judge('left'); e.preventDefault(); }
  else if (e.code === 'Enter' || e.key === 'Enter' || e.code==='ArrowRight') { judge('right'); e.preventDefault(); }
  else if (e.code==='ArrowLeft'){ judge('left'); e.preventDefault(); }
});

resetQuestionBoxUI();
setGrowthEmoji();
</script>
</body>
</html>

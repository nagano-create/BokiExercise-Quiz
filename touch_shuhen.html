<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BokiExercise 左右タッチ即判定クイズ（基礎11 周辺取引）</title>
<style>
:root { --bg:#0f1115; --fg:#e8eaf1; --muted:#9aa0a6; --ok:#1db954; --ng:#ff4d4f; --card:#171a21; }
* { box-sizing: border-box; }
html, body {
  height:100%; margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
#app { max-width:720px; margin:0 auto; display:flex; flex-direction:column; height:100%; }

header {
  display:flex; align-items:center; gap:10px;
  padding:12px 16px; background:var(--card);
}
header h1 { font-size:16px; margin:0; flex:1; }
.pill {
  font-size:11px; color:var(--muted);
  border:1px solid #2b2f3a; border-radius:999px; padding:2px 8px;
}

#questionBox {
  padding:18px 16px; text-align:center;
  font-size:clamp(20px,6vw,32px); line-height:1.4;
}
#sub { font-size:12px; color:var(--muted); }

#arena { flex:1; display:flex; }
.side {
  flex:1; display:flex; align-items:center; justify-content:center;
  font-size:clamp(28px,8vw,44px); font-weight:700;
  border-top:1px solid #222; user-select:none;
}
.left { border-right:1px solid #222; }
#scoreBar {
  padding:8px 16px; font-size:13px; color:var(--muted);
  display:flex; justify-content:space-between;
}
#controls {
  display:flex; gap:8px; padding:12px 16px; background:var(--card);
}
button {
  flex:1; padding:12px; font-size:14px;
  background:#1c222b; color:var(--fg);
  border:1px solid #2b2f3a; border-radius:10px;
}

#flash {
  position:fixed; inset:0; display:none;
  align-items:center; justify-content:center;
  font-size:clamp(56px,18vw,120px); font-weight:900;
}
#flash.ok { background:rgba(29,185,84,.12); color:var(--ok); }
#flash.ng { background:rgba(255,77,79,.12); color:var(--ng); }

#footerNote { text-align:center; font-size:11px; color:var(--muted); padding:8px; }
</style>
</head>
<body>

<div id="app">
<header>
  <a href="index.html" style="font-size:12px;color:var(--muted);text-decoration:none;">Top</a>
  <h1>BokiExercise 左右タッチ即判定クイズ</h1>
  <div class="pill">基礎11 周辺取引</div>
</header>

<div id="questionBox">
  <div id="question">スタートを押してください</div>
  <div id="sub">左＝借方 ／ 右＝貸方</div>
</div>

<div id="arena">
  <div class="side left"  onclick="judge('left')">左（借方）</div>
  <div class="side right" onclick="judge('right')">右（貸方）</div>
</div>

<div id="scoreBar">
  <div>問 <span id="idx">0</span>/<span id="total">0</span></div>
  <div>正解 <span id="ok">0</span> ／ ミス <span id="ng">0</span></div>
</div>

<div id="controls">
  <button onclick="start()">スタート / シャッフル</button>
  <button onclick="location.reload()">リセット</button>
</div>

<div id="footerNote">© BokiExercise</div>
</div>

<div id="flash"></div>

<script>
const questions = [
 { q:"クレジット売上が発生した。『クレジット売掛金』は？", correct:"left" },
 { q:"クレジット売上が発生した。『売上』は？", correct:"right" },

 { q:"クレジット売掛金が発生した。『支払手数料』は？", correct:"left" },
 { q:"クレジット売掛金を回収した。『クレジット売掛金』は？", correct:"right" },

 { q:"販売手数料を支払った。『支払手数料』は？", correct:"left" },
 { q:"販売手数料を差し引いて入金された。『普通預金』は？", correct:"left" },

 { q:"商品券を受け取って販売した。『受取商品券』は？", correct:"left" },
 { q:"商品券を受け取って販売した。『売上』は？", correct:"right" },

 { q:"小口現金係に現金を渡した。『小口現金』は？", correct:"left" },
 { q:"小口現金係に現金を渡した。『現金』は？", correct:"right" },

 { q:"小口現金で文房具を購入した。『消耗品費』は？", correct:"left" },
 { q:"小口現金で文房具を購入した。『小口現金』は？", correct:"right" },

 { q:"掛取引で電子記録債権が発生した。『電子記録債権』は？", correct:"left" },
 { q:"掛取引で電子記録債権が発生した。『売上』は？", correct:"right" },

 { q:"電子記録債務を支払った。『電子記録債務』は？", correct:"left" }
];

let idx=0, ok=0, ng=0;

const qEl=document.getElementById("question");
const idxEl=document.getElementById("idx");
const totalEl=document.getElementById("total");
const okEl=document.getElementById("ok");
const ngEl=document.getElementById("ng");
const flash=document.getElementById("flash");

totalEl.textContent=questions.length;

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
}

function start(){
 shuffle(questions);
 idx=0; ok=0; ng=0;
 okEl.textContent=0; ngEl.textContent=0;
 next();
}

function next(){
 if(idx>=questions.length){ qEl.textContent="終了です。お疲れさまでした！"; return; }
 qEl.textContent=questions[idx].q;
 idxEl.textContent=idx+1;
}

function judge(side){
 const isOK=side===questions[idx].correct;
 flash.textContent=isOK?"⭕":"❌";
 flash.className=isOK?"ok":"ng";
 flash.style.display="flex";
 setTimeout(()=>flash.style.display="none",300);
 if(isOK) ok++; else ng++;
 okEl.textContent=ok; ngEl.textContent=ng;
 idx++;
 setTimeout(next,500);
}
</script>
</body>
</html>

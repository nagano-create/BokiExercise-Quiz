<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BokiExercise 左右タッチ即判定（標準）</title>

<style>
  :root{
    --bg:#0f1115; --fg:#e8eaf1; --muted:#9aa0a6; --ok:#1db954; --ng:#ff4d4f; --card:#171a21;
    --bd:#2b2f3a;
  }
  *{ box-sizing:border-box; }
  html,body{
    height:100%; margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","YuGothic","Meiryo",sans-serif;
    overflow-x:hidden; /* 横スクロールバー防止 */
  }

  #app{
    display:flex; flex-direction:column;
    height:100%;
    max-width:720px;
    margin:0 auto;
  }

  /* ===== Header ===== */
  header{
    position:relative;
    padding:12px 16px;
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center; /* 中央寄せの基礎 */
    gap:10px;
  }

  /* Topボタン（常に左上固定） */
  .top-link{
    position:fixed;
    left:12px;
    top:10px;
    z-index:50;
    font-size:12px;
    color:var(--fg);
    text-decoration:none;
    border:1px solid var(--bd);
    background:rgba(15,17,21,.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding:6px 12px;
    border-radius:999px;
    opacity:.65; /* 問題中は半透明 */
    transition: opacity .15s ease, background .15s ease, transform .05s ease;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .top-link:active{ transform:scale(.98); }
  body.results .top-link{
    opacity:1; /* 結果画面では強調 */
    background:rgba(23,26,33,.92);
  }

  /* タイトル（2行・ど真ん中） */
  .title{
    text-align:center;
    line-height:1.05;
    user-select:none;
  }
  .title .t1{ font-size:14px; font-weight:700; letter-spacing:.02em; }
  .title .t2{ font-size:16px; font-weight:800; margin-top:2px; }

  /* 右上のピル（標準表示） */
  .pill{
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    padding:2px 10px;
    border:1px solid var(--bd);
    border-radius:999px;
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
  }

  /* ===== Question ===== */
  #questionBox{
    padding:14px 16px 10px;
    text-align:center;
    overflow-y:auto;
    max-height:38vh;  /* 問題文と結果が見えるように */
  }
  #question{
    margin:6px 0 4px;
    font-weight:700;
    font-size: clamp(20px, 6vw, 30px);
    line-height:1.35;
  }
  #sub{
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
  }

  /* ===== Arena ===== */
  #arena{ flex:1; display:flex; min-height: 220px; }
  .side{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: clamp(28px, 8vw, 44px);
    font-weight:800;
    border-top:1px solid #222;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .left{
    border-right:1px solid #222;
    background:linear-gradient(180deg, rgba(45,45,55,.25), rgba(0,0,0,.08));
  }
  .right{
    background:linear-gradient(180deg, rgba(45,45,55,.25), rgba(0,0,0,.08));
  }
  .label{ pointer-events:none; opacity:.92; }

  /* ===== Score ===== */
  #scoreBar{
    padding:8px 16px;
    font-size:13px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    gap:10px;
  }

  /* ===== Controls ===== */
  #controls{
    padding:12px 16px;
    background:var(--card);
    display:flex;
    justify-content:center;
  }
  button{
    width:100%;
    max-width:360px;
    padding:12px;
    border:1px solid var(--bd);
    background:#1c222b;
    color:var(--fg);
    border-radius:12px;
    font-size:14px;
    cursor:pointer;
  }
  button:active{ transform:scale(.98); }

  /* ===== Flash ===== */
  #flash{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    font-size: clamp(56px, 18vw, 120px);
    font-weight:900;
    z-index:10;
  }
  #flash.ok{ background:rgba(29,185,84,.12); color:var(--ok); }
  #flash.ng{ background:rgba(255,77,79,.12); color:var(--ng); }

  /* ===== Results ===== */
  .result-item{
    font-size:14px;
    margin-bottom:8px;
    text-align:left;
  }
  .badge{
    display:inline-block;
    min-width:2.2em;
    text-align:center;
    border-radius:999px;
    padding:0 6px;
    margin-right:6px;
    font-size:12px;
  }
  .badge-ok{ background:rgba(29,185,84,.15); color:var(--ok); }
  .badge-ng{ background:rgba(255,77,79,.15); color:var(--ng); }
  .small-muted{ font-size:11px; color:var(--muted); }

  .growth-emoji{ font-size:110px; line-height:1.05; }
  .growth-box{ text-align:center; margin:8px 0 10px; }

  textarea{
    width:100%;
    min-height:120px;
    background:#0f1319;
    color:var(--fg);
    border:1px solid var(--bd);
    border-radius:10px;
    padding:10px;
    font-size:12px;
  }

  #footerNote{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    padding:8px 0 12px;
  }
</style>
</head>

<body>
<a class="top-link" href="index.html" aria-label="トップへ戻る"><span aria-hidden="true">←</span><span>Top</span></a>

<div id="app">
  <header>
    <div class="title" aria-label="BokiExercise 左右タッチ即判定">
      <div class="t1">BokiExercise</div>
      <div class="t2">左右タッチ即判定</div>
    </div>
    <div class="pill">標準</div>
  </header>

  <div id="questionBox">
    <div id="question">スタートを押してください</div>
    <div id="sub">左右＝借方／貸方（●点=🌱、●点=🌿、満点=🌸）</div>
  </div>

  <div id="arena">
    <div class="side left" id="leftSide" role="button" aria-label="左">
      <div class="label">左</div>
    </div>
    <div class="side right" id="rightSide" role="button" aria-label="右">
      <div class="label">右</div>
    </div>
  </div>

  <div id="scoreBar">
    <div>問 <span id="idx">0</span>/<span id="total">0</span></div>
    <div>正解 <span id="ok">0</span> ・ ミス <span id="ng">0</span></div>
  </div>

  <div id="controls">
    <button id="btnStart">スタート / シャッフル</button>
  </div>

  <div id="footerNote">© BokiExercise</div>
</div>

<div id="flash"></div>

<script>
/* =========================================================
   ▼▼▼ ここだけ編集OK（問題文の差し替え専用） ▼▼▼
   ルール：
   - set_standard の中身だけ変更してOK
   - それ以外（CSS/HTML/共通JS）は触らない
========================================================= */

// 3級仕訳標準（15問）
const set_standard = [
  { q: "資産（現金・売掛金など）が『増加』するのは？", correct: "left" },
  { q: "資産（現金・売掛金など）が『減少』するのは？", correct: "right" },
  { q: "負債（買掛金・借入金など）が『増加』するのは？", correct: "right" },
  { q: "負債（買掛金・借入金など）が『減少』するのは？", correct: "left" },
  { q: "純資産（資本金・繰越利益剰余金など）が『増加』するのは？", correct: "right" },
  { q: "費用（仕入・給料・減価償却費など）が『発生』するのは？", correct: "left" },
  { q: "収益（売上・受取利息など）が『発生』するのは？", correct: "right" },
  { q: "売上が計上されたときの『売上』は？", correct: "right" },
  { q: "仕入で商品が増えたときの『仕入』は？", correct: "left" },
  { q: "備品を現金で購入したときの『備品』は？", correct: "left" },
  { q: "備品を現金で購入したときの『現金』は？", correct: "right" },
  { q: "家賃を支払ったときの『支払家賃』は？", correct: "left" },
  { q: "売掛金を回収して『現金』が増えたときの『現金』は？", correct: "left" },
  { q: "買掛金を支払って『買掛金』が減少したときの『買掛金』は？", correct: "left" },
  { q: "前受金が発生したときの『前受金』は？", correct: "right" }
];

/* ======================
   ▼ 共通ロジック（固定）
====================== */
let questions = JSON.parse(JSON.stringify(set_standard));
let idx = 0, ok = 0, ng = 0;

const elQ = document.getElementById('question');
const elSub = document.getElementById('sub');
const elIdx = document.getElementById('idx');
const elTotal = document.getElementById('total');
const elOk = document.getElementById('ok');
const elNg = document.getElementById('ng');
const flash = document.getElementById('flash');
const questionBox = document.getElementById('questionBox');

elTotal.textContent = questions.length;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function start(){
  document.body.classList.remove('results');
  idx = 0; ok = 0; ng = 0;
  questions = shuffle([...questions]);
  elOk.textContent = ok;
  elNg.textContent = ng;
  elTotal.textContent = questions.length;
  next();
}

function next(){
  if (idx >= questions.length){
    showResults();
    return;
  }
  const item = questions[idx];
  elQ.textContent = item.q;
  elIdx.textContent = idx+1;
  elSub.textContent = "左右＝借方／貸方（●点=🌱、●点=🌿、満点=🌸）";
}

function vibrate(ms=50){ if (navigator.vibrate) navigator.vibrate(ms); }

let audioCtx = null;
function beep(okFlag=true){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = okFlag ? 880 : 220;
    g.gain.value = 0.02;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    setTimeout(()=>{ o.stop(); }, 120);
  }catch(e){}
}

function showFlash(isOK){
  flash.className = isOK ? 'ok' : 'ng';
  flash.textContent = isOK ? '⭕' : '❌';
  flash.style.display = 'flex';
  setTimeout(()=>{ flash.style.display='none'; }, 350);
}

function judge(side){
  if (idx >= questions.length) return;
  const item = questions[idx];
  const isOK = (side === item.correct);

  showFlash(isOK);

  if (isOK){ ok++; vibrate(20); beep(true); }
  else { ng++; vibrate([30,40,30]); beep(false); }

  elOk.textContent = ok;
  elNg.textContent = ng;

  idx++;
  setTimeout(next, 600);
}

function showResults(){
  document.body.classList.add('results');

  const total = questions.length;
  const percent = total ? Math.round(ok / total * 100) : 0;

  // 成長表示：0-5=🌱 / 6-14=🌿 / 満点=🌸
  let emoji = "🌿";
  let msg   = "芽が出てきました。続ければきっと満開になります。";
  if (ok === total) { emoji="🌸"; msg="全問正解！花が咲きました。"; }
  else if (ok <= 5) { emoji="🌱"; msg="今日は種まきの日。少しずつ育てていきましょう。"; }

  let html = "";
  html += `
    <div class="growth-box">
      <div class="growth-emoji">${emoji}</div>
      <div class="small-muted">${msg}</div>
    </div>
  `;
  html += `<div style="margin-bottom:10px;font-size:18px;font-weight:700;">結果</div>`;
  html += `<div class="small-muted" style="margin-bottom:12px;">正解 ${ok} / ${total}（${percent}%）</div>`;
  html += `<div class="small-muted" style="margin-bottom:10px;">※もう一度やる場合は「スタート / シャッフル」を押してください。</div>`;

  questionBox.innerHTML = html;
  elIdx.textContent = total;
  elSub.textContent = 'お疲れさまでした。';
}

// UI
document.getElementById('leftSide').addEventListener('click', ()=>judge('left'));
document.getElementById('rightSide').addEventListener('click', ()=>judge('right'));
document.getElementById('btnStart').addEventListener('click', start);

// PC授業向け：Space=左 / Enter,→=右 / ←=左
window.addEventListener('keydown', (e)=>{
  if (e.code === 'Space' || e.key === ' ') { judge('left'); e.preventDefault(); }
  else if (e.code === 'Enter' || e.key === 'Enter' || e.code==='ArrowRight') { judge('right'); e.preventDefault(); }
  else if (e.code==='ArrowLeft'){ judge('left'); e.preventDefault(); }
});
</script>
</body>
</html>

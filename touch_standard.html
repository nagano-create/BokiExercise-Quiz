<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BokiExercise 左右タッチ即判定クイズ</title>

<style>
:root{
  --bg:#0f1115; --fg:#e8eaf1; --muted:#9aa0a6;
  --ok:#1db954; --ng:#ff4d4f; --card:#171a21;
}
*{box-sizing:border-box;}
html,body{
  margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
}
#app{max-width:720px;margin:0 auto;height:100%;display:flex;flex-direction:column;}

header{
  background:var(--card);
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px;
}
header h1{font-size:15px;margin:0;flex:1;}
.pill{
  font-size:11px;color:var(--muted);
  border:1px solid #2b2f3a;border-radius:999px;
  padding:2px 8px;
}

/* Topボタン */
.top-btn{
  position:sticky;
  left:0; top:0;
  font-size:12px;
  color:var(--muted);
  text-decoration:none;
  border:1px solid #2b2f3a;
  padding:4px 10px;
  border-radius:999px;
  opacity:.6;
}
.top-btn.active{opacity:1;}

#questionBox{
  padding:16px;
  text-align:center;
  font-size:clamp(20px,6vw,30px);
  line-height:1.4;
  max-height:40vh;
  overflow-y:auto;
}
#sub{font-size:12px;color:var(--muted);}

#arena{flex:1;display:flex;}
.side{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:clamp(28px,8vw,44px);
  font-weight:700;
  user-select:none;
}
.left{border-right:1px solid #222;}
.label{opacity:.85;}

#scoreBar{
  padding:8px 16px;
  font-size:13px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
}

#controls{
  display:flex;gap:8px;
  padding:12px 16px;
  background:var(--card);
}
button{
  flex:1;
  padding:12px;
  background:#1c222b;
  color:var(--fg);
  border:1px solid #2b2f3a;
  border-radius:10px;
  font-size:14px;
}

#flash{
  position:fixed;inset:0;
  display:none;
  align-items:center;justify-content:center;
  font-size:clamp(56px,18vw,120px);
  font-weight:900;
  z-index:10;
}
#flash.ok{background:rgba(29,185,84,.12);color:var(--ok);}
#flash.ng{background:rgba(255,77,79,.12);color:var(--ng);}

.result-item{font-size:14px;margin-bottom:8px;text-align:left;}
.badge-ok{color:var(--ok);}
.badge-ng{color:var(--ng);}
.small-muted{font-size:11px;color:var(--muted);}
.growth-emoji{font-size:120px;}

textarea{
  width:100%;
  min-height:120px;
  background:#0f1319;
  color:var(--fg);
  border:1px solid #2b2f3a;
  border-radius:8px;
  padding:10px;
  font-size:12px;
}
</style>
</head>

<body>
<div id="app">

<header>
  <a href="index.html" class="top-btn" id="topBtn">Top</a>
  <h1>BokiExercise 左右タッチ即判定クイズ</h1>
  <div class="pill">標準</div>
</header>

<div id="questionBox">
  <div id="question">スタートを押してください</div>
  <div id="sub">左＝借方 ／ 右＝貸方</div>
</div>

<div id="arena">
  <div class="side left" id="leftSide"><div class="label">左（借方）</div></div>
  <div class="side right" id="rightSide"><div class="label">右（貸方）</div></div>
</div>

<div id="scoreBar">
  <div>問 <span id="idx">0</span>/<span id="total">0</span></div>
  <div>正解 <span id="ok">0</span> ／ ミス <span id="ng">0</span></div>
</div>

<div id="controls">
  <button id="btnStart">スタート</button>
  <button id="btnReset">リセット</button>
</div>

</div>

<div id="flash"></div>

<script>
/* ===== 問題（正解確認済） ===== */
const questionsBase = [
  ["資産が増加するのは？","left"],
  ["資産が減少するのは？","right"],
  ["負債が増加するのは？","right"],
  ["負債が減少するのは？","left"],
  ["純資産が増加するのは？","right"],
  ["費用が発生するのは？","left"],
  ["収益が発生するのは？","right"],
  ["売上は？","right"],
  ["仕入は？","left"],
  ["備品（購入）は？","left"],
  ["現金（支払）は？","right"],
  ["支払家賃は？","left"],
  ["売掛金回収の現金は？","left"],
  ["買掛金の支払は？","left"],
  ["前受金は？","right"]
];

let questions=[], idx=0, ok=0, ng=0, results=[];

const qEl=document.getElementById("question");
const idxEl=document.getElementById("idx");
const totalEl=document.getElementById("total");
const okEl=document.getElementById("ok");
const ngEl=document.getElementById("ng");
const flash=document.getElementById("flash");
const box=document.getElementById("questionBox");
const topBtn=document.getElementById("topBtn");

totalEl.textContent=questionsBase.length;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

function start(){
  questions=questionsBase.map(q=>({q:q[0],a:q[1]}));
  shuffle(questions);
  idx=ok=ng=0; results=[];
  okEl.textContent=ngEl.textContent=0;
  next();
}

function next(){
  if(idx>=questions.length){ showResult(); return; }
  qEl.textContent=questions[idx].q;
  idxEl.textContent=idx+1;
}

function judge(side){
  const correct=questions[idx].a;
  const isOK=(side===correct);
  results.push({q:questions[idx].q,ok:isOK,side,correct});
  flash.className=isOK?"ok":"ng";
  flash.textContent=isOK?"⭕":"❌";
  flash.style.display="flex";
  setTimeout(()=>flash.style.display="none",300);
  isOK?ok++:ng++;
  okEl.textContent=ok; ngEl.textContent=ng;
  idx++;
  setTimeout(next,500);
}

function showResult(){
  topBtn.classList.add("active");
  let html="";
  if(ok===questions.length){
    html+=`<div class="growth-emoji">🌸</div><div class="small-muted">全問正解！</div>`;
  }
  html+=`<h3>結果 ${ok}/${questions.length}</h3>`;
  results.forEach((r,i)=>{
    html+=`<div class="result-item">
      ${r.ok?"<span class='badge-ok'>○</span>":"<span class='badge-ng'>×</span>"}
      ${i+1}. ${r.q}
    </div>`;
  });
  box.innerHTML=html;
}

document.getElementById("leftSide").onclick=()=>judge("left");
document.getElementById("rightSide").onclick=()=>judge("right");
document.getElementById("btnStart").onclick=start;
document.getElementById("btnReset").onclick=()=>location.reload();

document.addEventListener("keydown",e=>{
  if(e.code==="Space"){judge("left");e.preventDefault();}
  if(e.code==="Enter"||e.code==="ArrowRight"){judge("right");e.preventDefault();}
  if(e.code==="ArrowLeft"){judge("left");e.preventDefault();}
});
</script>
</body>
</html>
